name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Generates the route types and next-env.d.ts that tsc needs on a clean checkout.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p e2e/tsconfig.json
      - run: npm run build

  e2e:
    name: Browser tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Throwaway values for this job's own database. No real secret is needed:
    # the tests stand in for Cloudinary and never call the real service.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maka_test
      NEXTAUTH_SECRET: ci-only-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000
      CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_API_KEY: ci-only-api-key
      CLOUDINARY_API_SECRET: ci-only-api-secret
      CLOUDINARY_UPLOAD_PRESET: ci-preset
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run admin:create -- "$E2E_ADMIN_USERNAME"
        env:
          ADMIN_PASSWORD: ci-only-admin-password
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The only way this code reaches production: Auto-Deploy is off on Render, and
  # this job runs only when both jobs above passed on main.
  deploy:
    name: Deploy to Render
    needs: [build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set, so nothing was deployed. See README."
            exit 0
          fi
          curl --fail --silent --show-error --output /dev/null -X POST "$RENDER_DEPLOY_HOOK_URL"
